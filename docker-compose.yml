# PhotoHub on Synology Container Manager (Project -> Create -> this file).
# Paths are the DSM defaults from spec §6; adjust if your volumes differ.
services:
  photohub:
    build: ./server
    image: photohub:0.1.0
    container_name: photohub
    restart: unless-stopped
    env_file: .env
    # run as the DSM user "photohub" (id -u photohub / id -g photohub over SSH)
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      PHOTOHUB_ROOT: /data/photohub
      PHOTO_LIBRARY_ROOT: /data/photo
      PHOTOHUB_HOMES_ROOT: /data/homes
    volumes:
      - /volume1/photohub:/data/photohub          # inbox, work, processed, trash, db, cache, outbox
      - /volume1/photo:/data/photo                # Synology Photos shared space (everyone sees it)
      - /volume1/homes:/data/homes                # personal spaces: /data/homes/<user>/Photos (owner only)
    # Host network: the app finds the NAS on the home Wi-Fi (mDNS), PhotoHub learns the NAS's
    # LAN and Tailscale addresses by itself, and checks DSM passwords on this NAS (localhost:5001).
    # Port 8765. Do NOT forward it on the router; from outside use Tailscale.
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g
