# Builds the signed Android app and publishes it as a GitHub Release.
# Phones running PhotoHub update themselves from the latest Release.
#
# Release (same flow as the family's other apps): bump versionCode/versionName in
# android/app/build.gradle.kts, write android/app/release-notes.txt, commit and push to main.
# If release v<versionName> does not exist yet, this builds the signed APK and creates it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   PHOTOHUB_KEYSTORE_BASE64    base64 of photohub-release.jks
#   PHOTOHUB_KEYSTORE_PASSWORD  keystore password
#   PHOTOHUB_KEY_PASSWORD       key password
name: Android release

on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-release.yml

permissions:
  contents: write

# one release run at a time; a later run sees the release already exists and stops
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decide the release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$name already exists (bump versionName to publish); nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release key
        if: steps.ver.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.PHOTOHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "secret PHOTOHUB_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/photohub-release.jks"

      - name: Build signed APK
        if: steps.ver.outputs.skip == 'false'
        env:
          PHOTOHUB_KEYSTORE: ${{ runner.temp }}/photohub-release.jks
          PHOTOHUB_KEYSTORE_PASSWORD: ${{ secrets.PHOTOHUB_KEYSTORE_PASSWORD }}
          PHOTOHUB_KEY_ALIAS: photohub
          PHOTOHUB_KEY_PASSWORD: ${{ secrets.PHOTOHUB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest publishUpdate

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # a fixed-name copy gives a link that always points to the newest app:
          #   https://github.com/<owner>/<repo>/releases/latest/download/PhotoHub.apk
          cp ../dist/photohub-*.apk ../dist/PhotoHub.apk
          gh release create "$TAG" ../dist/photohub-*.apk ../dist/photohub-*.json ../dist/PhotoHub.apk \
            --target "$GITHUB_SHA" --title "PhotoHub $TAG" --notes-file app/release-notes.txt

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/photohub-release.jks"
