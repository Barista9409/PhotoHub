# Builds the NAS service image and publishes it to GitHub Container Registry, so the NAS only
# needs docker-compose.yml (no files to copy): image ghcr.io/barista9409/photohub:latest
name: Server image

on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/server-image.yml

permissions:
  contents: write   # the "server-latest" note the app reads
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        working-directory: server
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libimage-exiftool-perl ffmpeg p7zip-full
          pip install -q -e ".[test]"
          python -m pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name (lower case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build stamp
        id: stamp
        run: echo "b=$(TZ=Asia/Tokyo date +%Y-%m-%d-%H%M)-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          build-args: PHOTOHUB_BUILD=${{ steps.stamp.outputs.b }}
          # reuse unchanged layers between builds, so the NAS re-downloads only what changed
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}

      # What the newest server is, at a download address the app can read without the GitHub API
      # (the API allows 60 questions an hour per home connection). A pre-release that is never
      # "latest", so the app's own release stays the latest one.
      - name: Publish server-latest note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"build":"%s","sha":"%s","number":%s,"at":"%s"}\n' "${{ steps.stamp.outputs.b }}" "${GITHUB_SHA::7}" \
            "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > server.json
          gh release view server-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create server-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Synology側の最新版（自動）" --notes "アプリが読む目印です。消さないでください。"
          gh release upload server-latest server.json --clobber --repo "$GITHUB_REPOSITORY"
