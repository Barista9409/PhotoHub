[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photohub"
version = "0.1.0"
description = "PhotoHub: Takeout import, dedupe and sync service for Synology NAS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "imagehash>=4.3",
  "numpy>=1.26",
  "apscheduler>=3.10,<4",
  "watchdog>=4.0",
  "httpx>=0.27",
  "click>=8.1",
  "segno>=1.6",
  "zeroconf>=0.130",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
photohub = "photohub.cli:main"

[tool.setuptools.packages.find]
include = ["photohub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
